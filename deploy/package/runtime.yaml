# runtime.yaml — the exported package's configuration (DS-13). IT edits this and access.yaml; nothing else.
#
# Every secret named below is REQUIRED. A missing one stops the package at start-up and says which,
# and where it was looked for.
#
# Data stays inside the company only when llm.base_url (and embedding.base_url) point at an LLM that runs inside it.

bundle: bundle.json            # the agent: confirmed spec + workflow, exported from the platform

database:
  url_secret: runtime_db        # the package's OWN Postgres — checkpoints, approvals, audit chain

data_sources:                   # one entry per Hệ CSDL the workflow's data_query nodes read
                                # checked at start-up: a view or column the agent or access.yaml uses that is missing
                                # stops the package, naming each; a column added since the export is logged and left unread
  - id: "1"                     # the source_id the bundle's data_query nodes name
    name: ERP
    dialect: postgresql         # postgresql | sqlserver | mysql
    dsn_secret: erp_dsn         # a read-only account on the company's database
    access: access.yaml         # who may see which rows — identity + rules

llm:                            # any OpenAI-compatible endpoint
  base_url: http://llm.internal/v1
  api_key_secret: llm_key
  default_model: qwen2.5-72b-instruct
  models:                       # the model a node was evaluated with on the platform -> the model served here
    gpt-4.1-mini: qwen2.5-72b-instruct

# Documents (DS-18) — needed when the agent searches documents (knowledge_search). The bundle carries the original
# files in documents/<knowledge base id>/ and the platform's extraction of each in documents/.extraction/.
# On start-up every file not yet indexed (by content hash and embedding model) is indexed; a second start indexes
# nothing again. Every passage is sent to embedding.base_url — point it inside the company, like llm.base_url.
documents: documents
embedding:                      # any OpenAI-compatible /embeddings endpoint (vLLM, TEI, Ollama, LiteLLM…)
  base_url: http://llm.internal/v1
  api_key_secret: llm_key
  model: bge-m3                 # changing the model re-indexes everything on the next start
qdrant:                         # the package's own Qdrant; holds nothing but this package's documents
  url: http://qdrant:6333
  collection: agent_documents
reranker:                       # the platform's rerank service image; off by default — search keeps the fused order
  enabled: false
  url: http://reranker:8001

auth:                           # who is asking — one value, matched against access.yaml's identity.match_by
  mode: trusted_header          # trusted_header | jwt | oidc | custom; anything unverified is a 401, never a default asker
  header: X-Asker               # trusted_header: a gateway in front of the package signed the person in
  # claim: email                # jwt/oidc: which claim of the token is the asker
  # jwt:                        # a token your identity system signs (Authorization: Bearer ...)
  #   key_secret: jwt_key       #   HS*: the shared key; RS*/ES*: the PEM public key — itself a required secret
  #   algorithms: [HS256]
  #   issuer: https://sso.company.internal
  #   audience: agent-cong-no
  # oidc:                       # an OpenID Connect issuer; keys found through discovery, rotations followed
  #   issuer: https://sso.company.internal/realms/staff
  #   audience: agent-cong-no   #   the chat page sends the ID token, so: the client_id below
  #   client_id: agent-cong-no  #   a PUBLIC client (PKCE, no secret); redirect URI = this package's own / , web origin allowed
  # custom:                     # your own file with exactly one function: resolve_principal(request) -> str | None
  #   module: auth_adapter.py

mail:                           # where the agent's approved mails leave (gmail.send_email in the bundle) — required if it sends
  mode: smtp                    # smtp | gmail_oauth | custom; switching mode never needs a new bundle
  smtp:                         # the company's relay
    host: smtp.company.internal
    port: 587
    from: no-reply@company.vn   # every mail is sent from this address; the agent cannot change it
    user: agent-mailer
    password_secret: smtp_pass
    starttls: true              # a password_secret requires starttls; set false only for a password-less test relay (MailHog)
  # gmail_oauth:                # a Gmail account the company owns
  #   client_id: 1234.apps.googleusercontent.com
  #   client_secret_secret: gmail_client_secret
  #   refresh_token_secret: gmail_refresh_token
  # custom:                     # your own file with exactly one function: send_email(to, subject, body) -> str (message id)
  #   module: mail_adapter.py

secrets:
  backend: env                  # env | file | vault
  env_prefix: AGENT_SECRET_     # env:  AGENT_SECRET_RUNTIME_DB, AGENT_SECRET_ERP_DSN, AGENT_SECRET_LLM_KEY, AGENT_SECRET_SMTP_PASS
  # directory: /run/secrets     # file: one file per secret, named as above
  # vault: {url: https://vault.internal, mount: secret, token_env: VAULT_TOKEN}

trusted_hosts:                  # database hosts on a private network the package may dial
  - erp-db.internal
