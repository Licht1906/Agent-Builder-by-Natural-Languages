# Runs on the `internal-services` VM only (see ../../DEPLOYMENT.md). Same
# image/version as the root docker-compose.yml's `qdrant` on purpose — pointed
# at a persistent disk instead of a docker-managed volume so data survives VM
# recreation.
#
# `db`, `backend`, `reranker`, `mailhog` are NOT here: `db` is Cloud SQL,
# `backend`/`reranker` are Cloud Run, `mailhog` is dev-only and dropped for
# production (real SMTP relay instead — see DEPLOYMENT.md). No `vault` since
# DS-20 (credentials live in the SecretStore, in Cloud SQL) and no `policy`
# since DS-21 (the OPA sidecar was UC-1's PEP).
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /mnt/data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 5
