# Runs on the `internal-services` VM only (see ../../DEPLOYMENT.md). Same
# images/versions as the root docker-compose.yml's `qdrant`/`policy`/`vault`
# services on purpose — this is that subset, pointed at a persistent disk
# instead of a docker-managed volume so data survives VM recreation, and at
# `/opt/app/policy` (pushed by setup.sh from docs/usecase_spec/platform/)
# instead of a bind mount into the repo, since this VM never checks out the
# repo itself.
#
# `db`, `backend`, `reranker`, `mailhog` are NOT here: `db` is Cloud SQL,
# `backend`/`reranker` are Cloud Run, `mailhog` is dev-only and dropped for
# production (real SMTP relay instead — see DEPLOYMENT.md).
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /mnt/data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 5

  policy:
    image: openpolicyagent/opa:1.19.0
    restart: unless-stopped
    command: ["run", "--server", "--addr=:8181", "/policy/authz.rego"]
    ports:
      - "8181:8181"
    volumes:
      - /opt/app/policy:/policy:ro

  # Still dev-mode by deliberate choice (spec.md §16.1 scopes production-mode
  # +auto-unseal out of MVP) — see DEPLOYMENT.md's "Known gaps" section for
  # the tracking note. `VAULT_DEV_ROOT_TOKEN_ID` comes from /opt/app/.env
  # (a random token generated once by setup.sh — NOT the repo's
  # `dev-only-vault-token` default, since this instance is reachable from
  # Cloud Run and may hold real BYODB credentials).
  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
